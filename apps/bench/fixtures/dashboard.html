<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Live dashboard fixture</title>
        <style>
            body {
                margin: 0;
                font:
                    13px/1.4 system-ui,
                    sans-serif;
            }
            .layout {
                display: grid;
                grid-template-columns: 1fr 320px;
                gap: 16px;
                padding: 16px;
            }
            table {
                width: 100%;
                border-collapse: collapse;
            }
            td,
            th {
                padding: 4px 8px;
                border-bottom: 1px solid #eee;
                text-align: right;
                font-variant-numeric: tabular-nums;
            }
            tr.hot td {
                background: #fff4e5;
            }
            .ticker {
                position: fixed;
                bottom: 8px;
                left: 0;
                padding: 4px 12px;
                background: #111;
                color: #fff;
                border-radius: 4px;
            }
            .feed {
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .feed li {
                padding: 6px 0;
                border-bottom: 1px solid #eee;
            }
        </style>
    </head>
    <body>
        <div class="layout">
            <table>
                <thead>
                    <tr>
                        <th>Symbol</th>
                        <th>Bid</th>
                        <th>Ask</th>
                        <th>Last</th>
                        <th>Change</th>
                        <th>Volume</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
            <ul class="feed" id="feed"></ul>
        </div>
        <div class="ticker" id="ticker">Live</div>
        <script>
            // Mutation-heavy page. window.benchScenario.run(frames) performs a fixed amount of work per animation
            // frame, driven by a seeded PRNG so every run mutates the same nodes in the same order.
            ;(() => {
                const mulberry32 = seed => () => {
                    seed = (seed + 0x6d2b79f5) | 0
                    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
                }
                const rand = mulberry32(42)
                const tbody = document.getElementById('rows')
                const feed = document.getElementById('feed')
                const ticker = document.getElementById('ticker')
                const html = []
                for (let r = 0; r < 200; r++) {
                    html.push(`<tr><th>SYM${r}</th>`)
                    for (let c = 0; c < 5; c++) {
                        html.push(`<td>${(rand() * 1000).toFixed(2)}</td>`)
                    }
                    html.push('</tr>')
                }
                tbody.innerHTML = html.join('')
                const rows = Array.from(tbody.rows)
                const cells = Array.from(tbody.querySelectorAll('td'))
                const pick = list => list[Math.floor(rand() * list.length)]

                window.benchScenario = {
                    run(frames) {
                        return new Promise(resolve => {
                            let frame = 0
                            const tick = () => {
                                frame++
                                for (let i = 0; i < 20; i++) {
                                    pick(cells).textContent = (rand() * 1000).toFixed(2)
                                }
                                for (let i = 0; i < 10; i++) {
                                    pick(rows).classList.toggle('hot')
                                }
                                ticker.style.transform = `translateX(${(frame * 3) % 600}px)`
                                if (frame % 30 === 0) {
                                    const item = document.createElement('li')
                                    item.innerHTML = `<strong>Trade #${frame}</strong> <span>${(rand() * 100).toFixed(1)} @ ${(rand() * 1000).toFixed(2)}</span>`
                                    feed.prepend(item)
                                    if (feed.children.length > 50) {
                                        feed.lastElementChild.remove()
                                    }
                                }
                                if (frame < frames) {
                                    requestAnimationFrame(tick)
                                } else {
                                    resolve(frame)
                                }
                            }
                            requestAnimationFrame(tick)
                        })
                    }
                }
            })()
        </script>
    </body>
</html>
