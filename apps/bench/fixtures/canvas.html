<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Canvas animation fixture</title>
        <style>
            body {
                margin: 0;
                font:
                    13px/1.4 system-ui,
                    sans-serif;
            }
            header {
                padding: 12px 16px;
                border-bottom: 1px solid #eee;
            }
            canvas {
                display: block;
                margin: 16px;
            }
        </style>
    </head>
    <body>
        <header>Fleet map</header>
        <canvas id="map" width="960" height="540"></canvas>
        <script>
            // A 2D canvas animated every frame: a gradient, 120 moving markers and a clock, the kind of map or
            // chart a page redraws as data comes. window.benchScenario.run(frames) draws a fixed number of frames,
            // driven by a seeded PRNG so every run draws the same pictures.
            ;(() => {
                const mulberry32 = seed => () => {
                    seed = (seed + 0x6d2b79f5) | 0
                    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed)
                    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t
                    return ((t ^ (t >>> 14)) >>> 0) / 4294967296
                }
                const rand = mulberry32(42)
                const canvas = document.getElementById('map')
                const context = canvas.getContext('2d')
                const { width, height } = canvas
                const markers = Array.from({ length: 120 }, () => ({
                    x: rand() * width,
                    y: rand() * height,
                    dx: (rand() - 0.5) * 4,
                    dy: (rand() - 0.5) * 4,
                    hue: Math.floor(rand() * 360)
                }))

                const step = frame => {
                    const gradient = context.createLinearGradient(0, 0, width, height)
                    gradient.addColorStop(0, `hsl(${(frame / 2) % 360} 40% 92%)`)
                    gradient.addColorStop(1, `hsl(${(frame / 2 + 120) % 360} 40% 82%)`)
                    context.fillStyle = gradient
                    context.fillRect(0, 0, width, height)
                    for (const marker of markers) {
                        marker.x = (marker.x + marker.dx + width) % width
                        marker.y = (marker.y + marker.dy + height) % height
                        context.beginPath()
                        context.arc(marker.x, marker.y, 6, 0, Math.PI * 2)
                        context.fillStyle = `hsl(${marker.hue} 70% 45%)`
                        context.fill()
                    }
                    context.fillStyle = '#111'
                    context.font = '20px system-ui'
                    context.fillText(`Frame ${frame}`, 16, 32)
                }

                window.benchScenario = {
                    step,
                    run(frames) {
                        return new Promise(resolve => {
                            let frame = 0
                            const tick = () => {
                                step(++frame)
                                if (frame < frames) {
                                    requestAnimationFrame(tick)
                                } else {
                                    resolve(frame)
                                }
                            }
                            requestAnimationFrame(tick)
                        })
                    }
                }
                step(0)
            })()
        </script>
    </body>
</html>
