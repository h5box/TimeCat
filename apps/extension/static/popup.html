<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>TimeCat</title>
        <link rel="stylesheet" href="pages.css" />
        <script src="popup.js" defer></script>
    </head>
    <body class="popup">
        <header class="brand">
            <img src="icons/icon-32.png" alt="" width="20" height="20" />
            <span>TimeCat</span>
        </header>
        <button id="toggle" type="button" class="primary"></button>
        <p id="state" class="state"></p>
        <p id="error" class="error" role="alert"></p>
        <fieldset>
            <legend data-i18n="recordWhat"></legend>
            <label><input id="option-console" type="checkbox" /> <span data-i18n="optConsole"></span></label>
            <label><input id="option-network" type="checkbox" /> <span data-i18n="optNetwork"></span></label>
            <label><input id="option-perf" type="checkbox" /> <span data-i18n="optPerf"></span></label>
            <label><input id="option-canvas" type="checkbox" /> <span data-i18n="optCanvas"></span></label>
            <label><input id="option-video" type="checkbox" /> <span data-i18n="optVideo"></span></label>
            <label><input id="option-maskText" type="checkbox" /> <span data-i18n="optMask"></span></label>
            <p class="hint" data-i18n="optionsHint"></p>
        </fieldset>
        <a id="recordings" href="recordings.html" data-i18n="allRecordings"></a>
    </body>
</html>
